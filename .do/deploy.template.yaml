spec:
  name: namos-sessions
  static_sites:
    - name: web
      git:
        branch: main
        repo_clone_url: https://github.com/nayamoss/namos-sessions-public.git
      environment_slug: node-js
      build_command: npm ci && npm run build:hosted
      output_dir: dist
      index_document: index.html
      catchall_document: index.html
      envs:
        - key: CONVEX_DEPLOY_KEY
          value: "Enter your Convex production deploy key"
          scope: BUILD_TIME
          type: SECRET
        - key: VITE_CLERK_PUBLISHABLE_KEY
          value: "Enter your Clerk publishable key"
          scope: BUILD_TIME
          type: SECRET

