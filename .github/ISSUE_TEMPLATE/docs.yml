name: Documentation improvement
description: Report unclear, missing, or incorrect documentation
title: "docs: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      placeholder: README section, file path, or URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or missing?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested improvement
      description: Proposed wording is welcome but not required.
