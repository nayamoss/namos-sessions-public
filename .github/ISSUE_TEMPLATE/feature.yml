name: Feature request
description: Propose a scoped improvement to a Namos Sessions workflow
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, what are they trying to do, and where does the current workflow fall short?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or smaller approaches.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mockups, links, constraints, or accessibility considerations.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for duplicates.
          required: true
        - label: I am willing to help refine or implement this proposal.
